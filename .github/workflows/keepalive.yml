name: Keep Supabase awake

# Free Supabase projects pause after ~1 week of inactivity.
# This pings the REST endpoint so the DB stays live. (Vercel static hosting
# never sleeps, so nothing else needs pinging.)
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay under load)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "${SUPABASE_URL}/rest/v1/contacts?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
